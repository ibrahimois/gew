<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">git ew, pronounced gew</title>
  <desc id="description">A terminal prompt connected to a branching graph beside the git ew wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="280" rx="42" fill="url(#background)"/>
  <path d="M0 210 C210 145 340 300 545 224 C720 159 805 185 960 110 V280 H0Z" fill="#1e3a8a" opacity="0.22"/>

  <g transform="translate(58 50)" filter="url(#shadow)">
    <rect width="248" height="180" rx="26" fill="#020617" stroke="#334155" stroke-width="3"/>
    <circle cx="28" cy="25" r="6" fill="#fb7185"/>
    <circle cx="49" cy="25" r="6" fill="#facc15"/>
    <circle cx="70" cy="25" r="6" fill="#4ade80"/>
    <path d="M31 77 L58 99 L31 121" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 124 H122" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>

    <path d="M157 122 V78 C157 61 174 61 174 45" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M157 97 H202 C217 97 217 81 217 66" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="157" cy="126" r="11" fill="#38bdf8"/>
    <circle cx="174" cy="42" r="11" fill="#4ade80"/>
    <circle cx="217" cy="62" r="11" fill="#4ade80"/>
  </g>

  <g transform="translate(350 67)">
    <text x="0" y="74" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="78" font-weight="750" letter-spacing="-5">git ew</text>
    <rect x="5" y="96" width="162" height="46" rx="23" fill="url(#accent)"/>
    <text x="86" y="128" text-anchor="middle" fill="#082f49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="800">gew</text>
    <text x="190" y="128" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Git-like. REST-only.</text>
  </g>
</svg>
